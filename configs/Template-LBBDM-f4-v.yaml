# Latent Brownian Bridge Diffusion Model Template(Latent Space)
runner: "BBDMRunner"

training:
  n_epochs: 1000
  n_steps: 200000
  save_interval: 2
  sample_interval: 2
  validation_interval: 2
  accumulate_grad_batches: 4
  loss_type : 'latent-mask-loss' 
  
# choose from general (franka fg, not franka bg), union (franka and xarm fg, 1 - fg bg), union-diff (franka fg, 1 - (franka and xarm) bg) or no-mask

testing:
  clip_denoised: False
  sample_num: 5


data:
  dataset_name: "franka-to-xarm-lite-sim-cam-pose"
  dataset_type: "custom_aligned_camera" # use custom_aligned for data without camera params
  dataset_config:
    dataset_path: "training_data/paired-lite-6-cam-pose"
     # change 2 rel path later
    image_size: 256
    channels: 3
    to_normal: True
    flip: False
    use_cam_params : True
  train:
    batch_size: 8
    shuffle: False
  val:
    batch_size: 8
    shuffle: False
  test:
    batch_size: 8
    # shuffle: False

model:
  model_name: "LBBDM-f4" # part of result path
  model_type: "LBBDM" # specify a module
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False
  # model_load_path: "results/reverse-training-real-dataset/LBBDM-f4/checkpoint/top_model_epoch_998.pth" # model checkpoint path
  # optim_sche_load_path: "results/reverse-training-real-dataset/LBBDM-f4/checkpoint/top_optim_sche_epoch_998.pth" # optimizer scheduler checkpoint path

  CameraProj:
    use_cam_proj: True

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8 # step
    start_ema_step: 30000

  CondStageParams:
    n_stages: 2
    in_channels: 3
    out_channels: 3

  VQGAN:
    params:
      ckpt_path: "results/pretrained-VQGAN/vq-f4/model.ckpt"
      embed_dim: 3
      n_embed: 8192
      ddconfig:
        double_z: false
        z_channels: 3
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: !!python/tuple
          - 1
          - 2
          - 4
        num_res_blocks: 2
        attn_resolutions: []
        dropout: 0.0

      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: "Adam"
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: "linear" # options {'linear', 'sin'}
      objective: "grad" # options {'grad', 'noise', 'ysubx'}
      loss_type: "l1" # options {'l1', 'l2'}

      skip_sample: True
      sample_type: "linear" # options {"linear", "sin"}
      sample_step: 200

      num_timesteps: 1000 # timesteps
      eta: 1.0 # DDIM reverse process eta
      max_var: 1.0 # maximum variance

      UNetParams:
        image_size: 64
        in_channels: 3
        model_channels: 128
        out_channels: 3
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 32
          - 16
          - 8
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "nocond" # options {"SpatialRescaler", "first_stage", "nocond"}
